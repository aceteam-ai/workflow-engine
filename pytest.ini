[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# CI runs on Linux and the suite has no main-thread signal handlers. The
# signal method raises in the test runner, allowing pytest fixtures to unwind;
# the thread method may instead terminate the runner and strand its children.
markers =
    graphviz: Requires the Graphviz executable to render and check the diagram
    unit: mark test as a unit test
    integration: mark test as an integration test

python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts = -v -ra -q --timeout=180 --timeout-method=signal
